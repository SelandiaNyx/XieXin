name: 构建 Arch Linux 便携版

# 为什么需要 CI：Windows 上无法产出 Linux 二进制（链接需要 ELF 工具链与 glibc），
# 所以 Linux 包在 Arch 容器里构建，产出与 Windows 便携版同构的"解压即用"压缩包。
on:
  workflow_dispatch:
  push:
    tags:
      - 'v0.1.*'
      - 'v0.2.*'
      - 'v1.*'

permissions:
  contents: write   # 打 tag 时需要把产物挂到 Release

jobs:
  arch-portable:
    name: Arch Linux 便携包
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    steps:
      - name: 安装构建依赖
        run: |
          # 注意 Arch 的包名与 Debian 不同：
          #   xdo            ← Debian 里叫 libxdo，仅 Rust 构建期需要
          #   rust           ← 直接指定，否则 "cargo" 会在 rust/rustup 之间交互式提问
          #   webkit2gtk-4.1 ← Tauri 2 的 WebView 后端（4.0 是 Tauri 1 用的，别装错）
          pacman -Syu --noconfirm --needed \
            base-devel git rust pkgconf \
            webkit2gtk-4.1 gtk3 librsvg libsoup3 patchelf \
            alsa-lib xdo

      - uses: actions/checkout@v4

      - name: 缓存 cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: arch-cargo-${{ hashFiles('src-tauri/Cargo.lock', 'src-tauri/Cargo.toml') }}
          restore-keys: arch-cargo-

      - name: 构建 release
        working-directory: src-tauri
        run: cargo build --release --locked

      - name: 打包便携目录
        run: |
          set -eux
          version=$(grep -m1 '^version' src-tauri/Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')
          out="release/XieXin-linux-${version}"
          mkdir -p "$out"
          cp src-tauri/target/release/novel-manager "$out/HeartWrite"
          cp LICENSE "$out/LICENSE"
          cp src-tauri/icons/512x512.png "$out/HeartWrite.png"

          # 桌面入口：Exec 用相对路径，解压到任何位置都能直接跑
          cat > "$out/HeartWrite.desktop" <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=写心
          Name[en]=HeartWrite
          Comment=本地小说写作工作台
          Exec=./HeartWrite
          Icon=HeartWrite
          Terminal=false
          Categories=Office;WordProcessor;
          MimeType=text/plain;
          EOF

          chmod +x "$out/HeartWrite"
          tar -czf "release/XieXin-linux-${version}.tar.gz" -C release "XieXin-linux-${version}"
          ls -l release/

      - name: 冒烟测试（无头，不创建窗口）
        run: |
          # --smoke-test 走无头分支、不建窗口，所以不需要 X 显示。
          # 这一步确认打出来的二进制真能跑：建书→写作→版本→排版→导出→导入→回收站→重载。
          ./release/XieXin-linux-*/HeartWrite --smoke-test --data-dir /tmp/smoke
          cat /tmp/smoke/smoke-report.txt

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: xiexin-arch-linux
          path: release/XieXin-linux-*.tar.gz
          if-no-files-found: error

      - name: 挂到 Release（仅 tag 推送时）
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Arch 容器里没有 gh，直接用 GitHub API 上传
          tag="${GITHUB_REF_NAME}"
          version=$(grep -m1 '^version' src-tauri/Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')
          asset="release/XieXin-linux-${version}.tar.gz"
          echo "上传 $asset 到 Release $tag"
          curl -sSfL -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Content-Type: application/octet-stream" \
            --data-binary "@${asset}" \
            "https://uploads.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/${tag}/assets?name=$(basename "$asset")"
