name: 构建 Android APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'v0.1.*'
      - 'v0.2.*'
      - 'v1.*'

permissions:
  contents: write   # 打 tag 时需要把 APK 挂到 Release

jobs:
  android:
    name: Android APK
    # 移动端必须在 Linux/macOS 上构建；这里用 Ubuntu。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Linux 构建依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev \
            libgtk-3-dev libglib2.0-dev

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0 ndk;26.1.10909125'

      - name: 定位 NDK 并写入环境变量
        run: |
          # 不能引用 env.ANDROID_NDK_LATEST_HOME：这个 runner 上它是空的，
          # tauri 会报 "Android NDK invalid"。改为按实际安装位置发现。
          ndk_root="${ANDROID_HOME}/ndk"
          ls -1 "$ndk_root"
          ndk_dir=$(find "$ndk_root" -maxdepth 1 -mindepth 1 -type d | sort | tail -n1)
          echo "NDK_HOME=$ndk_dir" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ndk_dir" >> "$GITHUB_ENV"
          test -f "$ndk_dir/source.properties" && echo "NDK 就绪：$ndk_dir"

      - name: 安装 Rust 与 Android target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: 缓存 cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: android-cargo-${{ hashFiles('src-tauri/Cargo.lock', 'src-tauri/Cargo.toml') }}
          restore-keys: android-cargo-

      - name: 安装 Tauri CLI
        run: cargo install tauri-cli --version '^2' --locked

      - name: 生成 Android 工程
        run: |
          # tauri android init 只需要跑一次，但 CI 里每次都从干净目录开始，
          # 所以这里生成后立刻构建；gen/ 不进仓库。
          cargo tauri android init --ci

      - name: 为 Android 注入 cdylib（先备份）
        run: |
          # Cargo 不支持按 target 条件设置 crate-type（[target.'cfg(..)'.lib] 是无效
          # manifest key，只会得到 "unused manifest key" 警告），而仓库里的 [lib] 必须是
          # 纯 rlib —— 否则 Windows 的 GNU ld 会在生成导出序号时溢出
          # （"export ordinal too large"）。
          #
          # 这里备份 manifest 并就地改写那一行，构建结束后无论如何都还原。
          # 注意不能用"追加第二个 [lib] 段"的写法：cargo 容忍重复段，但 tauri-cli 的
          # TOML 解析器会报 "duplicate key"。
          # 缺 cdylib 时的报错是：
          #   Library artifact not found at .../libnovel_manager_lib.so
          cp src-tauri/Cargo.toml src-tauri/Cargo.toml.android-backup
          sed -i 's|^crate-type = \["rlib"\]$|crate-type = ["cdylib", "rlib"]|' src-tauri/Cargo.toml
          grep -n 'crate-type' src-tauri/Cargo.toml

      - name: 构建 APK（按 ABI 拆分）
        run: |
          cargo tauri android build --apk --split-per-abi --ci

      - name: 还原 manifest
        if: always()
        run: |
          # 无论构建成功失败都还原，避免 CI 里留下被改过的 manifest（下一轮构建会基于它）。
          if [ -f src-tauri/Cargo.toml.android-backup ]; then
            mv -f src-tauri/Cargo.toml.android-backup src-tauri/Cargo.toml
          fi
          # 兜底：万一上面的备份也没了，直接从 git 取回原始版本
          git checkout -- src-tauri/Cargo.toml
          echo "还原后：" && grep -n 'crate-type' src-tauri/Cargo.toml

      - name: 收集 APK
        run: |
          mkdir -p dist
          find src-tauri/gen/android -name '*.apk' -exec cp {} dist/ \;
          ls -lh dist/

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: xiexin-android-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: 挂到 Release（仅 tag 推送时）
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eux
          tag="${GITHUB_REF_NAME}"
          for apk in dist/*.apk; do
            echo "上传 $apk 到 Release $tag"
            gh release upload "$tag" "$apk" --clobber --repo "$GITHUB_REPOSITORY"
          done
