name: 构建 Android APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'v0.1.*'
      - 'v0.2.*'
      - 'v1.*'

permissions:
  contents: write   # 打 tag 时需要把 APK 挂到 Release

jobs:
  android:
    name: Android APK
    # 移动端必须在 Linux/macOS 上构建；这里用 Ubuntu。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Linux 构建依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev \
            libgtk-3-dev libglib2.0-dev

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0 ndk;26.1.10909125'

      - name: 安装 Rust 与 Android target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: 缓存 cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: android-cargo-${{ hashFiles('src-tauri/Cargo.lock', 'src-tauri/Cargo.toml') }}
          restore-keys: android-cargo-

      - name: 安装 Tauri CLI
        run: cargo install tauri-cli --version '^2' --locked

      - name: 生成 Android 工程
        env:
          NDK_HOME: ${{ env.ANDROID_NDK_LATEST_HOME }}
        run: |
          # tauri android init 只需要跑一次，但 CI 里每次都从干净目录开始，
          # 所以这里生成后立刻构建；gen/ 不进仓库。
          cargo tauri android init --ci

      - name: 构建 APK（按 ABI 拆分）
        env:
          NDK_HOME: ${{ env.ANDROID_NDK_LATEST_HOME }}
        run: |
          cargo tauri android build --apk --split-per-abi --ci

      - name: 收集 APK
        run: |
          mkdir -p dist
          find src-tauri/gen/android -name '*.apk' -exec cp {} dist/ \;
          ls -lh dist/

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: xiexin-android-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: 挂到 Release（仅 tag 推送时）
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eux
          tag="${GITHUB_REF_NAME}"
          for apk in dist/*.apk; do
            echo "上传 $apk 到 Release $tag"
            gh release upload "$tag" "$apk" --clobber --repo "$GITHUB_REPOSITORY"
          done
